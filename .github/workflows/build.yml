name: Build
on:
  push:
    branches:
      - master
      - main
  schedule:
    # Every day at 09:23 UTC (1:23 AM Pacific). Off the top of the hour,
    # because GitHub delays or drops many scheduled runs queued at :00.
    - cron: '23 9 * * *'
  workflow_dispatch:

# The deploy step pushes to the gh-pages branch, which needs write access.
# New repositories give GITHUB_TOKEN read-only access by default.
# actions: write lets the keepalive step below re-enable this workflow.
permissions:
  contents: write
  actions: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # We need the previous commit to determine which stats source changed
          fetch-depth: 2
      - name: Activate MySQL # as per https://github.com/actions/virtual-environments/blob/main/images/linux/Ubuntu2004-README.md#mysql
        run: sudo systemctl start mysql.service
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Build pages
        run: bin/ci.sh
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          keep_files: true
          enable_jekyll: true
      - name: Keep the daily schedule alive
        # GitHub turns off scheduled workflows in public repos after 60 days
        # with no repository activity. Re-enabling the workflow on every run
        # resets that timer, so the daily build doesn't silently stop.
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/build.yml/enable" || true
